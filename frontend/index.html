<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1F4E79" />
  <title>智选云 AI 电商在线售货系统</title>
  <link rel="stylesheet" href="assets/style.css?v=3" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar-inner">
      <a class="brand" href="#/">
        <span class="brand-mark">AI</span>
        <span class="brand-text">
          <strong>智选云 AI 电商</strong>
          <em>AI-ECP · 在线售货系统</em>
        </span>
      </a>
      <nav class="mainnav" id="nav">
        <a href="#/" data-route="/">首页</a>
        <a href="#/products" data-route="/products">商品</a>
        <a href="#/cart" data-route="/cart">购物车<span class="cart-badge hidden" id="cartBadge">0</span></a>
        <a href="#/orders" data-route="/orders">我的订单</a>
        <a href="#/admin" data-route="/admin" id="navAdmin" class="hidden">商家后台</a>
        <span id="navUser"></span>
      </nav>
    </div>
  </header>

  <main class="wrap" id="app">
    <!-- 视图由 app.js 渲染 -->
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p><strong>智选云 AI 电商在线售货系统</strong>（AI-ECP · AI E-Commerce Platform） · 基于成果包需求分析与系统设计实现</p>
      <p class="muted">核心模块：用户注册登录 · 商品浏览与搜索 · 购物车 · 下单与支付 · 订单管理 · 后台商品与订单管理 · 品类 JSON 自定义 · 智能客服/选品/组货</p>
    </div>
  </footer>

  <!-- AI 客服浮窗 -->
  <button class="chat-fab" id="chatFab" title="智能客服">💬</button>
  <div class="chat-panel hidden" id="chatPanel">
    <div class="ch-head">智能客服（AI）<button class="x" id="chatClose">×</button></div>
    <div class="chat-body" id="chatBody"></div>
    <div class="chat-input">
      <input id="chatInput" placeholder="问我订单/物流/退换货…" />
      <button id="chatSend">发送</button>
    </div>
  </div>

  <script src="assets/app.js?v=3"></script>
</body>
</html>
